# Stage 1 of ci.yml. Check only: formats the checkout with seqan/actions/lint and fails if that changed anything.
# The CI run then ends early (later stages are skipped), and lint_autofix.yml pushes the formatting commit, which
# starts a new CI run. The diff is shown in the job summary, for PRs the bot cannot push to.

name: Lint

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # locked via actions.lock
        with:
          fetch-depth: 0
          persist-credentials: false

      # Files changed since: the PR's base (pull_request), the previous tip (push), or the last commit (dispatch).
      - name: Format
        uses: seqan/actions/lint@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}

      - name: Check
        run: |
          if ! git diff --quiet; then
            { echo '### Formatting required'; echo '```diff'; git diff; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Formatting required. The bot pushes a fix if the PR allows edits by maintainers."
            exit 1
          fi
