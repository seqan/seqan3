name: Cookbook

on:
  push:
    branches:
      - 'main'

concurrency:
  group: update-cookbook-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Berlin

defaults:
  run:
    shell: bash -Eexuo pipefail {0}

jobs:
  update-cookbook:
    name: Update Cookbook
    runs-on: ubuntu-latest
    environment: main-bot # deployment branch: main
    if: github.repository_owner == 'seqan'
    timeout-minutes: 15
    steps:
      - name: Create App token
        id: token
        uses: actions/create-github-app-token@v3 # locked via actions.lock
        with:
          client-id: ${{ vars.SEQAN_MAIN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEQAN_MAIN_BOT_KEY }}
          permission-contents: write

      - name: Checkout SeqAn3
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.SEQAN_ACTIONS_GPG_KEY }}
          passphrase: ${{ secrets.SEQAN_ACTIONS_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Update cookbook
        run: ./test/scripts/add_snippets_to_cookbook.sh .

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          add: ./doc/cookbook/index.md
          author_name: seqan-actions[bot]
          author_email: seqan-actions@users.noreply.github.com
          message: '[MISC] Update cookbook'
